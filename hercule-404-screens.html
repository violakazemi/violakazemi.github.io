<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hercule 404 page screens - Viola Kazemi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#E3EAF4;color:#10213F;font-family:'Figtree','Helvetica Neue',sans-serif;font-size:16px}
main{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding:24px 16px}
figure{margin:0}
figcaption{font-size:13px;font-weight:600;color:#44536E;margin-bottom:8px}
.wrap{width:312px;height:675px;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(16,33,63,.14)}
.phone{width:390px;height:844px;transform:scale(.8);transform-origin:top left;background:#F4F7FB;padding:20px 24px 24px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;justify-content:space-between;gap:12px}.base{align-items:baseline}
.rowc{display:flex;gap:14px;align-items:center;padding:16px}
.col{display:flex;flex-direction:column}.g4{gap:4px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.mt36{margin-top:36px;align-items:flex-start}
.logo{font-family:'Bricolage Grotesque','Helvetica Neue',sans-serif;font-weight:700;font-size:22px;letter-spacing:.12em;color:#1746A2}
.muted{color:#44536E}.s13{font-size:13px;line-height:1.35}.s14{font-size:14px;line-height:1.4}.s19{font-size:19px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#44536E}
h1{margin:0;font-family:'Bricolage Grotesque','Helvetica Neue',sans-serif;font-weight:700;font-size:32px;line-height:1.12}
.h30{font-size:30px}
.lead{margin:0;line-height:1.45;color:#2B3A57}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(16,33,63,.10)}
.flat{box-shadow:none}.pad{padding:16px 18px 18px}
.photo{height:210px;background:#D6E2F5;display:flex;align-items:center;justify-content:center;font-size:14px;color:#2B3A57}
.thumb{width:84px;height:84px;flex:none;border-radius:14px;background:#D6E2F5;display:flex;align-items:center;justify-content:center;font-size:11px;color:#2B3A57}
.dish{font-family:'Bricolage Grotesque','Helvetica Neue',sans-serif;font-weight:600;font-size:22px}
.was{font-size:14px;color:#44536E;text-decoration:line-through}.now{font-size:18px;font-weight:600;color:#1746A2}
.accent{font-weight:600;color:#1746A2}.total{font-size:20px;font-weight:600}
.rule{height:1px;background:#D6E2F5}
.big{font-family:'Bricolage Grotesque','Helvetica Neue',sans-serif;font-weight:600;font-size:28px}
.check{width:64px;height:64px;border-radius:32px;background:#1746A2;display:flex;align-items:center;justify-content:center}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
button{height:56px;border:0;border-radius:16px;background:#1746A2;color:#fff;font:600 18px 'Figtree',sans-serif;cursor:pointer}
.foot a,.back{min-height:44px;display:flex;align-items:center;justify-content:center;font-weight:500;color:#1746A2}
.back{font-size:15px}
</style>
</head>
<body>
<main>
<figure><figcaption>1 &middot; 404 page</figcaption><div class="wrap"><div class="phone"><div class="row base"><div class="logo">HERCULE</div><div class="muted s13">Greek kitchen</div></div>
<div class="col g10"><div class="eyebrow">404 &middot; GREEK20 link</div><h1>Good news: you still get 10% off.</h1><p class="lead">At the moment we don't have the 20% deal. Your 10% is applied automatically, no code needed.</p></div>
<div class="card"><div class="photo">[PHOTO: Greek salad]</div><div class="pad col g8"><div class="row base"><div class="dish">Greek salad</div><div><span class="was">[PRICE]</span> <span class="now">[PRICE &minus;10%]</span></div></div><div class="muted s14">Tomato, cucumber, red onion, olives, feta, oregano</div></div></div>
<div class="foot"><button type="button">Order with 10% off</button><a href="#">See the full menu</a></div></div></div></figure>
<figure><figcaption>2 &middot; Your order</figcaption><div class="wrap"><div class="phone"><div class="row base"><div class="logo">HERCULE</div><a class="back" href="#">Back</a></div>
<h1 class="h30">Your order</h1>
<div class="card flat rowc"><div class="thumb">[PHOTO]</div><div class="col g4"><div class="dish s19">Greek salad</div><div class="muted s13">Tomato, cucumber, red onion, olives, feta, oregano</div><div class="s14">Qty 1</div></div></div>
<div class="card flat pad col g12"><div class="row"><span>Subtotal</span><span>[PRICE]</span></div><div class="row accent"><span>10% off, applied for you</span><span>&minus;[10%]</span></div><div class="row"><span>Tax</span><span>[TAX]</span></div><div class="rule"></div><div class="row total"><span>Total</span><span>[TOTAL]</span></div></div>
<div class="card flat pad col g4"><div class="eyebrow">Pickup</div><div>[HERCULE ADDRESS]</div><div class="muted s14">Ready in [PREP TIME]</div></div>
<div class="foot"><button type="button">Place order &middot; [TOTAL]</button><a href="#">Add something else</a></div></div></div></figure>
<figure><figcaption>3 &middot; Confirmation</figcaption><div class="wrap"><div class="phone"><div class="logo">HERCULE</div>
<div class="col g14 mt36"><div class="check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1>Order placed. You saved 10%.</h1><p class="lead">We're making your Greek salad now.</p></div>
<div class="card pad col g14"><div><div class="eyebrow">Ready for pickup</div><div class="big">[PICKUP TIME]</div></div><div class="rule"></div><div class="row"><span class="muted">Where</span><span>[HERCULE ADDRESS]</span></div><div class="row"><span class="muted">Order</span><span>[ORDER NUMBER]</span></div><div class="row"><span class="muted">Paid</span><span>[TOTAL]</span></div></div>
<div class="foot"><button type="button">Get directions</button><a href="#">Back to the menu</a></div></div></div></figure>
</main>
</body>
</html>
