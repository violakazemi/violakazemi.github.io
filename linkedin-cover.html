<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Cover</title>
    <!-- Use the existing CSS for perfect theme matching -->
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5; /* Just a backdrop */
        }

        .linkedin-banner {
            /* LinkedIn cover recommended size is 1584 x 396 px (4:1 ratio) */
            width: 1584px;
            height: 396px;
            background-color: var(--color-bg); /* Cream background from theme */
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid var(--color-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* Subtle decorative elements for the "jewelry-box" aesthetic */
        .decoration-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--color-primary), #d4af37, var(--color-primary)); /* Maroon to Gold to Maroon */
            opacity: 0.8;
        }

        .decoration-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #d4af37, var(--color-primary), #d4af37); 
            opacity: 0.8;
        }
        
        .circle-accent {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.15); /* very faint gold */
            top: -100px;
            right: -100px;
        }
        
        .circle-accent-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            border: 1px solid rgba(var(--color-primary-rgb), 0.05);
            bottom: -200px;
            left: -150px;
        }

        .content {
            z-index: 10;
            text-align: center;
        }

        h1 {
            font-family: var(--font-family-serif, Georgia, serif);
            font-size: 54px;
            color: var(--color-text-primary);
            margin: 0;
            letter-spacing: 2px;
            font-weight: 500;
        }

        h2 {
            font-family: var(--font-family-sans, 'Inter', sans-serif);
            font-size: 24px;
            color: var(--color-text-secondary);
            margin-top: 16px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        /* The specific text styling */
        .highlight {
            color: var(--color-primary); /* Maroon */
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- This container is exactly the right size for a LinkedIn cover -->
    <div class="linkedin-banner" id="capture-area">
        <div class="decoration-top"></div>
        <div class="circle-accent"></div>
        <div class="circle-accent-2"></div>
        
        <div class="content">
            <h1>NBU</h1>
            <h2>Design for <span class="highlight">Next Billion Users</span></h2>
        </div>
        
        <div class="decoration-bottom"></div>
    </div>

</body>
</html>
